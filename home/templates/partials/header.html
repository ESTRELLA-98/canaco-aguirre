{% load static %}
<div class="topbar">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="topbar-date"><i class="bi bi-calendar3 me-2"></i>{% now "l, d \d\e F \d\e Y" %}</span>
        <div class="topbar-social">
            <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
        </div>
    </div>
</div>

<nav class="navbar navbar-expand-lg site-nav sticky-top">
    <div class="container">
        <a href="{% url 'home:index' %}" class="navbar-brand logo">Canaco<span class="logo-dot">.</span></a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav mx-auto site-menu">
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'home:index' %}">Inicio</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Categoría</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{% url 'home:categoria' %}">Todas</a></li>
                        <li><a class="dropdown-item" href="{% url 'home:categoria' %}">Tecnología</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'perfil' %}active{% endif %}" href="{% url 'home:perfil' %}">Perfil</a></li>
            </ul>

            <form action="#" class="search-form me-lg-3 mb-3 mb-lg-0">
                <i class="bi bi-search"></i>
                <input type="text" class="form-control" placeholder="Buscar...">
            </form>

            {% if request.user.is_authenticated %}
            <div class="d-flex align-items-center gap-2 nav-actions">
                <a href="{% url 'home:perfil' %}" class="nav-user"><i class="bi bi-person-circle me-1"></i>{{ request.user.username }}</a>
                <form method="post" action="{% url 'home:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-coral">Cerrar sesión</button>
                </form>
            </div>
            {% else %}
            <div class="d-flex align-items-center gap-2 nav-actions">
                <a href="{% url 'home:login' %}" class="btn btn-sm btn-outline-primary">Iniciar sesión</a>
                <a href="{% url 'home:sign_up' %}" class="btn btn-sm btn-coral">Registro</a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>
